services:
  - type: web
    name: cleanbharat-ai
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
      alembic upgrade head
      python3 -c "from backend.app.database import SessionLocal; from backend.app.models.user import User; from backend.app.services.seeder import seed_database; db = SessionLocal(); seed_database(db) if db.query(User).count() == 0 else None; db.close()"
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./cleanbharat.db
